<!DOCTYPE html>
<html lang="sq">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Asistent bisedor për sintaksën e gjuhës shqipe. Funksionon pa internet.">
    <title>Asistenti Digjital</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/app.css">
</head>
<body class="h-dvh flex flex-col overflow-hidden bg-albania-dark relative">

    <div class="absolute inset-0 bg-pattern pointer-events-none" aria-hidden="true"></div>
    <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-red-900/20 rounded-full blur-[120px] pointer-events-none" aria-hidden="true"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-red-900/10 rounded-full blur-[120px] pointer-events-none" aria-hidden="true"></div>

    <header id="app-header" class="relative z-20 flex items-center justify-between gap-3 px-4 sm:px-6 pb-4 pt-[max(1rem,env(safe-area-inset-top))] pl-[max(1rem,env(safe-area-inset-left))] pr-[max(1rem,env(safe-area-inset-right))] bg-albania-charcoal/80 backdrop-blur-xl border-b border-white/5 shadow-md">
        <div class="flex items-center gap-4 min-w-0">
            <div class="bg-albania-red p-2.5 rounded-lg shadow-[0_0_15px_rgba(228,30,32,0.4)] flex items-center justify-center shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white" aria-hidden="true"><path d="M16 8a4 4 0 0 0-3.32-1.78l-1.38-2.74a1 1 0 0 0-1.6 0L8.32 6.22A4 4 0 0 0 5 10c0 2.21 1.79 4 4 4v6l3-3 3 3v-6a4 4 0 0 0 4-4Z"/></svg>
            </div>
            <div class="min-w-0">
                <h1 class="font-bold text-white tracking-wide text-lg hidden sm:block">Asistenti Digjital</h1>
                <h1 class="font-bold text-white tracking-wide text-lg sm:hidden">Asistenti</h1>
                <p class="text-[11px] text-red-400 font-medium uppercase tracking-widest">Gjuha Shqipe</p>
            </div>
        </div>
        <div class="flex items-center gap-2 sm:gap-4 shrink-0">
            <button id="restart-btn" type="button" aria-label="Rifillo bisedën" title="Rifillo bisedën" class="flex items-center justify-center w-9 h-9 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 transition-all text-gray-300 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button id="glossary-btn" type="button" aria-haspopup="dialog" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 transition-all text-xs sm:text-sm text-gray-300 hover:text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                Udhëzues
            </button>
            <div class="hidden sm:flex items-center border-l border-white/10 pl-4" title="Funksionon pa internet">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse-slow mr-2" aria-hidden="true"></span>
                <span class="text-xs text-gray-400">Gati</span>
            </div>
        </div>
    </header>

    <main id="chat-container" class="relative z-10 flex-1 overflow-y-auto px-4 sm:px-6 py-6 pl-[max(1rem,env(safe-area-inset-left))] pr-[max(1rem,env(safe-area-inset-right))] scroll-smooth">
        <div id="messages-list" role="log" aria-live="polite" aria-relevant="additions" aria-label="Biseda" class="max-w-3xl mx-auto flex flex-col pb-4"></div>

        <div id="typing-indicator" class="hidden max-w-3xl mx-auto w-full mb-8 pl-2" role="status" aria-label="Asistenti po shkruan">
            <div class="flex items-end gap-3">
                <div class="bg-albania-bubbleBot border border-white/5 px-4 py-3 rounded-2xl rounded-bl-none flex items-center gap-1.5 shadow-lg" aria-hidden="true">
                    <span class="w-1.5 h-1.5 rounded-full typing-dot"></span>
                    <span class="w-1.5 h-1.5 rounded-full typing-dot"></span>
                    <span class="w-1.5 h-1.5 rounded-full typing-dot"></span>
                </div>
            </div>
        </div>
    </main>

    <footer id="app-footer" class="relative z-20 px-4 pt-4 pb-[max(1rem,env(safe-area-inset-bottom))] pl-[max(1rem,env(safe-area-inset-left))] pr-[max(1rem,env(safe-area-inset-right))] bg-albania-charcoal/90 backdrop-blur-xl border-t border-white/5">
        <div class="max-w-3xl mx-auto">
            <div id="quick-replies" role="group" aria-label="Përgjigje të shpejta" class="hidden flex-wrap gap-2 mb-3"></div>
            <form id="chat-form" class="relative flex items-center gap-3" autocomplete="off">
                <input
                    id="user-input"
                    type="text"
                    placeholder="Shkruaj përgjigjen tënde..."
                    aria-label="Shkruaj përgjigjen tënde"
                    maxlength="300"
                    enterkeyhint="send"
                    autocomplete="off"
                    autocapitalize="sentences"
                    spellcheck="false"
                    class="w-full bg-[#0F0F0F] text-gray-100 placeholder-gray-500 rounded-xl py-4 pl-5 pr-14 border border-white/10 focus:outline-none focus:ring-1 focus:ring-albania-red focus:border-albania-red transition-all shadow-inner font-light disabled:opacity-60"
                >
                <button
                    type="submit"
                    id="send-btn"
                    aria-label="Dërgo"
                    class="absolute right-2.5 p-2 bg-albania-red text-white rounded-lg hover:bg-red-700 disabled:opacity-50 disabled:cursor-not-allowed transition-all shadow-[0_4px_14px_0_rgba(228,30,32,0.39)] hover:shadow-[0_6px_20px_rgba(228,30,32,0.23)] hover:-translate-y-0.5"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                </button>
            </form>
            <div class="text-center mt-3 flex justify-center items-center gap-2 opacity-60 hover:opacity-100 transition-opacity duration-300">
                <p class="text-[10px] text-gray-400 uppercase tracking-widest font-semibold">
                    Shkolla "Lasgush Poradeci"
                </p>
                <span class="text-red-500" aria-hidden="true">•</span>
                <p class="text-[10px] text-gray-400 font-serif italic">2026</p>
            </div>
        </div>
    </footer>

    <div id="glossary-modal" class="fixed inset-0 z-50 hidden" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-black/80 backdrop-blur-sm transition-opacity opacity-0" id="glossary-backdrop"></div>

        <div class="fixed inset-0 z-10 overflow-y-auto">
            <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
                <div id="glossary-panel" class="relative transform overflow-hidden rounded-2xl bg-[#1a1a1a] border border-white/10 text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg opacity-0 scale-95">
                    <div class="bg-albania-red/10 px-4 py-3 sm:px-6 border-b border-white/10 flex justify-between items-center">
                        <h3 class="text-lg font-semibold leading-6 text-white flex items-center gap-2" id="modal-title">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-400" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
                            Udhëzues Gramatikor
                        </h3>
                        <button id="close-glossary" type="button" aria-label="Mbyll udhëzuesin" class="text-gray-400 hover:text-white transition-colors p-1 rounded-md hover:bg-white/5">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                        </button>
                    </div>
                    <div class="px-4 py-5 sm:p-6 max-h-[60vh] overflow-y-auto">
                        <div id="glossary-content" class="space-y-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <noscript>
        <p class="relative z-30 p-6 text-center text-gray-300">Ky aplikacion kërkon JavaScript për të funksionuar.</p>
    </noscript>

    <script src="assets/app.js" defer></script>
</body>
</html>
